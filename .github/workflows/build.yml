name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoReorder.xcodeproj \
            -scheme PhotoReorder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -n 120

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoReorder.app Payload/
          zip -qry PhotoReorder.ipa Payload
          ls -lh PhotoReorder.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/PhotoReorder.app/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoReorder-ipa
          path: PhotoReorder.ipa
          retention-days: 90
